# Языковая модель отдельным файлом, а не в compose.yaml.
#
# Приложение обязано работать без неё: оценка и рекомендации считаются правилами,
# окно генерации сообщает, что модель не подключена, разбор помечается
# недоступным. Поэтому сайдкар подключается явно и только там, где он нужен:
#
#   docker compose -f compose.yaml -f compose.llm.yaml up --build -d
#
# Веса не входят в образ: файл GGUF кладётся в ./models и монтируется. Для
# локального контура это и есть способ доставки — флэшкой или разовой загрузкой
# на машине с доступом. Какой файл, откуда скачать и как проверить —
# docs/PROJECT_DOCUMENTATION.md, раздел 10.5.
services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    volumes:
      - ./models:/models:ro
    command: >
      -m /models/${LLM_MODEL:-qwen2.5-7b-q4.gguf}
      --host 0.0.0.0
      --port 8080
      -c ${LLM_CONTEXT:-4096}
      -t ${LLM_THREADS:-10}
      --parallel ${LLM_PARALLEL:-1}
    ports:
      - "${LLM_PORT:-8090}:8080"
    healthcheck:
      # Модель грузится с диска: на Linux — десятки секунд, на Windows из примонтированной
      # папки ./models — больше десяти минут (7B Q4, 28.09). С коротким start_period
      # compose объявлял сайдкар нездоровым и не поднимал бэкенд вовсе.
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 1200s
    restart: unless-stopped

  backend:
    environment:
      # Без этого файла переменная пуста — модель отключена
      ARM112_LLM_URL: http://llm:8080
    depends_on:
      llm:
        condition: service_healthy
