spring:
  application:
    name: arm112-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/arm112}
    username: ${SPRING_DATASOURCE_USERNAME:arm112}
    password: ${SPRING_DATASOURCE_PASSWORD:arm112}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_MAXIMUM_POOL_SIZE:10}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: always
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

arm112:
  version: 0.3.0
  public-base-url: ${ARM112_PUBLIC_BASE_URL:http://localhost:8080}
  jwt-secret: ${ARM112_JWT_SECRET:local-training-secret-key-change-me-2026}
  token-ttl: PT8H
  allowed-origins: ${ARM112_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  seed:
    admin-password: ${ARM112_SEED_ADMIN_PASSWORD:admin}
    teacher-password: ${ARM112_SEED_TEACHER_PASSWORD:teacher}
    trainee-password: ${ARM112_SEED_TRAINEE_PASSWORD:trainee}
    analytics-demo-enabled: ${ARM112_SEED_ANALYTICS_DEMO_ENABLED:true}
  backup:
    dir: ${ARM112_BACKUP_DIR:./backups}
    cron: ${ARM112_BACKUP_CRON:0 0 2 * * *}
  materials:
    dir: ${ARM112_MATERIALS_DIR:./materials-store}
  log-file: ${ARM112_LOG_FILE:./logs/arm112.log}

logging:
  level:
    ru.lct.arm112: INFO
  file:
    name: ${ARM112_LOG_FILE:./logs/arm112.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi.yaml
    disable-swagger-default-url: true
    operations-sorter: alpha
    tags-sorter: alpha
    persist-authorization: true
