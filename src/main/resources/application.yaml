spring:
  application:
    name: arm112-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/arm112}
    username: ${SPRING_DATASOURCE_USERNAME:arm112}
    password: ${SPRING_DATASOURCE_PASSWORD:arm112}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_MAXIMUM_POOL_SIZE:10}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: always
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

arm112:
  version: 0.3.0
  public-base-url: ${ARM112_PUBLIC_BASE_URL:http://localhost:8080}
  jwt-secret: ${ARM112_JWT_SECRET:local-training-secret-key-change-me-2026}
  token-ttl: PT8H
  refresh-token-ttl: P7D
  swagger:
    public: ${ARM112_SWAGGER_PUBLIC:true}
  allowed-origins: ${ARM112_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  seed:
    admin-password: ${ARM112_SEED_ADMIN_PASSWORD:admin}
    teacher-password: ${ARM112_SEED_TEACHER_PASSWORD:teacher}
    trainee-password: ${ARM112_SEED_TRAINEE_PASSWORD:trainee}
    analytics-demo-enabled: ${ARM112_SEED_ANALYTICS_DEMO_ENABLED:true}
  llm:
    # Пусто — генерация работает на перестановке билетов. Сайдкар подключается
    # через compose.llm.yaml, см. docs/assessment/LLM_EXPERIMENT.md
    url: ${ARM112_LLM_URL:}
  jobs:
    poll-ms: ${ARM112_JOBS_POLL_MS:1000}
    batch-size: ${ARM112_JOBS_BATCH_SIZE:2}
  service-monitor:
    interval-ms: ${ARM112_SERVICE_MONITOR_INTERVAL_MS:30000}
    initial-delay-ms: ${ARM112_SERVICE_MONITOR_INITIAL_DELAY_MS:15000}
  alerts:
    phone:
      gateway-url: ${ARM112_ALERT_CALL_GATEWAY_URL:}
      gateway-token: ${ARM112_ALERT_CALL_GATEWAY_TOKEN:}
      numbers: ${ARM112_ALERT_PHONE_NUMBERS:}
      number: ${ARM112_ALERT_PHONE_NUMBER:}
  backup:
    dir: ${ARM112_BACKUP_DIR:./backups}
    external-dir: ${ARM112_BACKUP_EXTERNAL_DIR:}
    retention-days: ${ARM112_BACKUP_RETENTION_DAYS:14}
    cron: ${ARM112_BACKUP_CRON:0 0 2 * * *}
  materials:
    dir: ${ARM112_MATERIALS_DIR:./materials-store}
  log-file: ${ARM112_LOG_FILE:./logs/arm112.log}

logging:
  level:
    ru.lct.arm112: INFO
  file:
    name: ${ARM112_LOG_FILE:./logs/arm112.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

springdoc:
  api-docs:
    enabled: ${ARM112_SWAGGER_PUBLIC:true}
  swagger-ui:
    enabled: ${ARM112_SWAGGER_PUBLIC:true}
    path: /swagger-ui.html
    url: /openapi.yaml
    disable-swagger-default-url: true
    operations-sorter: alpha
    tags-sorter: alpha
    persist-authorization: true
