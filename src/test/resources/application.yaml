spring:
  datasource:
    url: jdbc:h2:mem:arm112-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  flyway:
    enabled: true

arm112:
  version: 0.3.0-test
  jwt-secret: local-training-secret-key-change-me-2026
  token-ttl: PT8H
  refresh-token-ttl: P7D
  swagger:
    public: true
  allowed-origins: http://localhost:3000,http://localhost:5173
  seed:
    admin-password: admin
    teacher-password: teacher
    trainee-password: trainee
  backup:
    dir: ./target/test-backups
    external-dir: ./target/test-offsite-backups
    retention-days: 2
    cron: "0 0 2 * * *"
  materials:
    dir: ./target/test-materials
  log-file: ./target/test-arm112.log

logging:
  file:
    name: ./target/test-arm112.log

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi.yaml
    disable-swagger-default-url: true
