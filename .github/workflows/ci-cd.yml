name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/dema-koder/lct2026-arm112-backend
  FRONTEND_IMAGE: ghcr.io/dema-koder/lct2026-arm112-frontend

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        # golden.strict: эталонные прогоны валят сборку при расхождении с ожиданиями.
        # Включено после того, как ожидания сверены с поведением на нескольких этапах подряд.
        # Симулятор когорты в CI не гоняется — это генератор данных, а не тест.
        run: >
          mvn --batch-mode clean verify
          -Dtest='!CohortSimulator'
          -Dgolden.strict=true
          -Dgolden.stage=ci
          -Dgolden.commit=${{ github.sha }}

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test production build
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  publish:
    name: Build and publish images
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and publish frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=/api/v1
            NEXT_PUBLIC_WS_URL=/ws/v1
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://103.112.71.71
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/arm112_deploy
          chmod 600 ~/.ssh/arm112_deploy
          printf '%s\n' '103.112.71.71 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIO26PeMAmjLyU9lQWY36OxStOJ7W6etEawVXmddAKo4y' > ~/.ssh/known_hosts
      - name: Upload deployment configuration
        run: |
          ssh -i ~/.ssh/arm112_deploy root@103.112.71.71 'install -d -m 750 /opt/arm112/deploy'
          scp -i ~/.ssh/arm112_deploy compose.production.yaml root@103.112.71.71:/opt/arm112/compose.production.yaml
          scp -i ~/.ssh/arm112_deploy deploy/nginx.conf root@103.112.71.71:/opt/arm112/deploy/nginx.conf
          scp -i ~/.ssh/arm112_deploy deploy/deploy.sh root@103.112.71.71:/opt/arm112/deploy/deploy.sh
      - name: Pull and restart application
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/arm112_deploy root@103.112.71.71 \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh -i ~/.ssh/arm112_deploy root@103.112.71.71 \
            "RELEASE_SHA='$RELEASE_SHA' bash /opt/arm112/deploy/deploy.sh"
          ssh -i ~/.ssh/arm112_deploy root@103.112.71.71 'docker logout ghcr.io >/dev/null 2>&1 || true'
      - name: Remove local SSH key
        if: always()
        run: rm -f ~/.ssh/arm112_deploy
