name: arm112-production

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - max_connections=30
      - -c
      - shared_buffers=32MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 192m
    pids_limit: 100
    logging: *default-logging

  backend:
    image: ${BACKEND_IMAGE}
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=25 -XX:+ExitOnOutOfMemoryError
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_MAXIMUM_POOL_SIZE: 8
      ARM112_JWT_SECRET: ${ARM112_JWT_SECRET}
      ARM112_ALLOWED_ORIGINS: ${ARM112_ALLOWED_ORIGINS}
      ARM112_SEED_ADMIN_PASSWORD: ${ARM112_SEED_ADMIN_PASSWORD}
      ARM112_SEED_TEACHER_PASSWORD: ${ARM112_SEED_TEACHER_PASSWORD}
      ARM112_SEED_TRAINEE_PASSWORD: ${ARM112_SEED_TRAINEE_PASSWORD}
      ARM112_BACKUP_DIR: /data/backups
      ARM112_BACKUP_EXTERNAL_DIR: /offsite-backups
      ARM112_BACKUP_RETENTION_DAYS: ${ARM112_BACKUP_RETENTION_DAYS:-14}
      ARM112_SWAGGER_PUBLIC: 'false'
      ARM112_MATERIALS_DIR: /data/materials
      ARM112_LOG_FILE: /data/logs/arm112.log
    volumes:
      - backend_data:/data
      - ${ARM112_OFFSITE_BACKUP_DIR:-/opt/arm112/offsite-backups}:/offsite-backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 12
    restart: unless-stopped
    mem_limit: 384m
    pids_limit: 200
    logging: *default-logging

  frontend:
    image: ${FRONTEND_IMAGE}
    environment:
      NODE_OPTIONS: --max-old-space-size=128
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 10
    restart: unless-stopped
    mem_limit: 192m
    pids_limit: 150
    logging: *default-logging

  proxy:
    image: nginx:1.29-alpine
    ports:
      - 80:80
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 48m
    pids_limit: 50
    logging: *default-logging

volumes:
  postgres_data:
  backend_data:
