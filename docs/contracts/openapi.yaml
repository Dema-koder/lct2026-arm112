openapi: 3.1.0
info:
  title: ARM-112 Training Service API
  version: 0.3.0
  description: |
    Контракт учебного сервиса подготовки операторов ДДС: три роли (администратор, преподаватель,
    обучающийся), два режима занятий (заполнение карточки оператора 112 и действия с карточкой ДДС),
    персональные занятия, оценка ИИ с приоритетом оценки преподавателя, аудит.
    Все ответы строгие (`additionalProperties: false`): новое поле — новая версия контракта.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
    contractVersion: []
tags:
  - name: Auth
  - name: Trainee
  - name: References
  - name: Training
  - name: Cards
  - name: Drafts
  - name: Calls
  - name: Assessment
  - name: Teacher
  - name: Admin
paths:
  # ------------------------------------------------------------------ auth
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      security:
        - contractVersion: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Вход выполнен
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      responses:
        '200':
          description: Текущий пользователь
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
  /auth/password:
    post:
      tags: [Auth]
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordChangeRequest'}
      responses:
        '204': {description: Пароль изменён}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  /auth/ws-ticket:
    post:
      tags: [Auth]
      operationId: createWebSocketTicket
      responses:
        '201':
          description: Одноразовый билет WebSocket
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WsTicket'}
  # ------------------------------------------------------------------ trainee
  /trainee/context:
    get:
      tags: [Trainee]
      operationId: getTraineeContext
      responses:
        '200':
          description: Контекст рабочего места
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TraineeContext'}
  /trainee/results:
    get:
      tags: [Trainee]
      operationId: listTraineeResults
      description: Свои результаты. Зачёт виден только после публикации преподавателем (visible=false до этого).
      responses:
        '200':
          description: Результаты занятий
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ResultItem'}
  /trainee/rating:
    get:
      tags: [Trainee]
      operationId: getTraineeRating
      responses:
        '200':
          description: Рейтинг и место в группе
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Rating'}
  /trainee/materials:
    get:
      tags: [Trainee]
      operationId: listTraineeMaterials
      responses:
        '200':
          description: Материалы, назначенные группе
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Material'}
  /trainee/materials/{id}/download:
    get:
      tags: [Trainee]
      operationId: downloadMaterial
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: Файл материала
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '403': {$ref: '#/components/responses/ErrorResponse'}
  # ------------------------------------------------------------------ references
  /references:
    get:
      tags: [References]
      operationId: getReferences
      parameters:
        - in: query
          name: version
          schema: {type: string}
      responses:
        '200':
          description: Версионированные справочники
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReferenceBundle'}
  /references/incident-types:
    get:
      tags: [References]
      operationId: searchIncidentTypes
      parameters:
        - in: query
          name: query
          schema: {type: string}
          description: Поиск по неизменяемой части слова и синонимам, как в оригинале
      responses:
        '200':
          description: Типы происшествий
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/IncidentTypeItem'}
  /references/survey-cards/{incidentTypeId}:
    get:
      tags: [References]
      operationId: getSurveyCard
      parameters:
        - in: path
          name: incidentTypeId
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Опросная карта типа
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SurveyCard'}
  # ------------------------------------------------------------------ training sessions
  /training-sessions:
    get:
      tags: [Training]
      operationId: listTrainingSessions
      responses:
        '200':
          description: Свои занятия
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SessionSummary'}
  /training-sessions/active:
    get:
      tags: [Training]
      operationId: getActiveTrainingSession
      responses:
        '200':
          description: Активная персональная сессия
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrainingSession'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
  /training-sessions/{sessionId}:
    get:
      tags: [Training]
      operationId: getTrainingSession
      parameters:
        - {$ref: '#/components/parameters/SessionId'}
      responses:
        '200':
          description: Состояние занятия
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrainingSession'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
  /training-sessions/{sessionId}/submit:
    post:
      tags: [Training]
      operationId: submitTrainingSession
      parameters:
        - {$ref: '#/components/parameters/SessionId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202':
          description: Оценка рассчитана
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SubmitResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  /training-sessions/{sessionId}/events:
    get:
      tags: [Training]
      operationId: getTrainingEvents
      parameters:
        - {$ref: '#/components/parameters/SessionId'}
        - in: query
          name: afterSequence
          required: true
          schema: {type: integer, minimum: 0}
      responses:
        '200':
          description: Пропущенные события
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventPage'}
  # ------------------------------------------------------------------ cards (ДДС)
  /cards:
    get:
      tags: [Cards]
      operationId: listCards
      parameters:
        - in: query
          name: sessionId
          required: true
          schema: {type: string, format: uuid}
        - in: query
          name: status
          schema: {$ref: '#/components/schemas/CardStatus'}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
      responses:
        '200':
          description: Журнал карточек своей сессии
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CardPage'}
  /cards/{cardId}:
    get:
      tags: [Cards]
      operationId: getCard
      parameters:
        - {$ref: '#/components/parameters/CardId'}
      responses:
        '200':
          description: Карточка ДДС. Первый запрос обучающегося запускает задержку открытия; после readyAt следующий запрос переводит карточку в «Получена службой».
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IncidentCard'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
  /cards/{cardId}/acceptance:
    post:
      tags: [Cards]
      operationId: decideCardAcceptance
      parameters:
        - {$ref: '#/components/parameters/CardId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AcceptanceCommand'}
      responses:
        '200':
          description: Решение зафиксировано
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IncidentCard'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  /cards/{cardId}/reaction-events:
    post:
      tags: [Cards]
      operationId: addReactionEvent
      parameters:
        - {$ref: '#/components/parameters/CardId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReactionCommand'}
      responses:
        '200':
          description: Действие зафиксировано
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IncidentCard'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  /cards/{cardId}/outbound-calls:
    post:
      tags: [Calls]
      operationId: startOutboundCall
      parameters:
        - {$ref: '#/components/parameters/CardId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StartCallRequest'}
      responses:
        '201':
          description: Исходящий звонок начат
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OutboundCall'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  /outbound-calls/{callId}:
    get:
      tags: [Calls]
      operationId: getOutboundCall
      parameters:
        - {$ref: '#/components/parameters/CallId'}
      responses:
        '200':
          description: Состояние звонка
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OutboundCall'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
  /outbound-calls/{callId}/end:
    post:
      tags: [Calls]
      operationId: endOutboundCall
      parameters:
        - {$ref: '#/components/parameters/CallId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200':
          description: Звонок завершён
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OutboundCall'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  # ------------------------------------------------------------------ drafts (оператор 112)
  /card-drafts:
    get:
      tags: [Drafts]
      operationId: listCardDrafts
      parameters:
        - in: query
          name: sessionId
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Черновики карточек сессии
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CardDraft'}
    post:
      tags: [Drafts]
      operationId: createCardDraft
      description: Следующая вводная из очереди занятия. Если есть незакрытый черновик — возвращается он.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateDraftRequest'}
      responses:
        '201':
          description: Черновик с вводной и таймером
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CardDraft'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /card-drafts/{draftId}:
    get:
      tags: [Drafts]
      operationId: getCardDraft
      parameters:
        - {$ref: '#/components/parameters/DraftId'}
      responses:
        '200':
          description: Черновик
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CardDraft'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
    patch:
      tags: [Drafts]
      operationId: patchCardDraft
      description: Частичное обновление полей. Службы пересчитываются по ЕКП при смене типов; автоматические удалить нельзя.
      parameters:
        - {$ref: '#/components/parameters/DraftId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CardDraftPatch'}
      responses:
        '200':
          description: Обновлённый черновик (с подсказками в режиме тренировки)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CardDraft'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  /card-drafts/{draftId}/save:
    post:
      tags: [Drafts]
      operationId: saveCardDraft
      description: Фиксирует время, делает карточку сценарием «сформировано обучающимися»; последняя вводная завершает занятие.
      parameters:
        - {$ref: '#/components/parameters/DraftId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200':
          description: Карточка сохранена
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CardDraft'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  # ------------------------------------------------------------------ assessment
  /assessments/{assessmentId}:
    get:
      tags: [Assessment]
      operationId: getAssessment
      parameters:
        - in: path
          name: assessmentId
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Итоговая оценка (преподавателя, если есть, иначе ИИ)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Assessment'}
        '403':
          description: RESULTS_NOT_PUBLISHED — зачёт ещё не опубликован, либо чужой результат
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
  # ------------------------------------------------------------------ teacher
  /teacher/scenarios:
    get:
      tags: [Teacher]
      operationId: listScenarios
      parameters:
        - {in: query, name: category, schema: {type: string}}
        - {in: query, name: source, schema: {$ref: '#/components/schemas/ScenarioSource'}}
        - {in: query, name: confirmed, schema: {type: boolean}}
      responses:
        '200':
          description: Библиотека сценариев
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ScenarioListItem'}
    post:
      tags: [Teacher]
      operationId: createScenario
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ScenarioUpsert'}
      responses:
        '201':
          description: Сценарий создан
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Scenario'}
  /teacher/scenarios/generate:
    post:
      tags: [Teacher]
      operationId: generateScenarios
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GenerateRequest'}
      responses:
        '201':
          description: Сгенерированные сценарии (эталон не подтверждён)
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Scenario'}
  /teacher/scenarios/{id}:
    get:
      tags: [Teacher]
      operationId: getScenario
      parameters:
        - {$ref: '#/components/parameters/StringId'}
      responses:
        '200':
          description: Сценарий с эталоном
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Scenario'}
    put:
      tags: [Teacher]
      operationId: updateScenario
      parameters:
        - {$ref: '#/components/parameters/StringId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ScenarioUpsert'}
      responses:
        '200':
          description: Обновлено
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Scenario'}
  /teacher/scenarios/{id}/confirm-reference:
    post:
      tags: [Teacher]
      operationId: confirmReference
      parameters:
        - {$ref: '#/components/parameters/StringId'}
      responses:
        '200':
          description: Эталон подтверждён преподавателем
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Scenario'}
  /teacher/groups:
    get:
      tags: [Teacher]
      operationId: listTeacherGroups
      responses:
        '200':
          description: Свои группы с участниками
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Group'}
  /teacher/lessons:
    get:
      tags: [Teacher]
      operationId: listLessons
      parameters:
        - {in: query, name: state, schema: {$ref: '#/components/schemas/LessonState'}}
      responses:
        '200':
          description: Свои занятия
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Lesson'}
    post:
      tags: [Teacher]
      operationId: createLesson
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LessonCreate'}
      responses:
        '201':
          description: Занятие создано (черновик, сессии ожидают старта)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Lesson'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  /teacher/lessons/{id}:
    get:
      tags: [Teacher]
      operationId: getLesson
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: Занятие
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Lesson'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
  /teacher/lessons/{id}/start:
    post:
      tags: [Teacher]
      operationId: startLesson
      description: У каждого участника стартует персональная сессия с его АРМ из учётной записи.
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: Занятие начато
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Lesson'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /teacher/lessons/{id}/complete:
    post:
      tags: [Teacher]
      operationId: completeLesson
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: Занятие завершено, незавершённые сессии оценены по факту
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Lesson'}
  /teacher/lessons/{id}/publish:
    post:
      tags: [Teacher]
      operationId: publishLessonResults
      description: Только для зачёта (kind=EXAM) после завершения.
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: Результаты опубликованы
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Lesson'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /teacher/lessons/{id}/monitor:
    get:
      tags: [Teacher]
      operationId: monitorLesson
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: Состояние всех участников
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LessonMonitor'}
  /teacher/lessons/{id}/report:
    get:
      tags: [Teacher]
      operationId: lessonReport
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: Отчёт по занятию
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LessonReport'}
  /teacher/lessons/{id}/report.csv:
    get:
      tags: [Teacher]
      operationId: lessonReportCsv
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: Отчёт в CSV (UTF-8 с BOM, разделитель «;»)
          content:
            text/csv:
              schema: {type: string}
  /teacher/sessions/{sessionId}:
    get:
      tags: [Teacher]
      operationId: getSessionDetail
      parameters:
        - {$ref: '#/components/parameters/SessionId'}
      responses:
        '200':
          description: Сессия обучающегося целиком
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionDetail'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
  /teacher/sessions/{sessionId}/assessment:
    put:
      tags: [Teacher]
      operationId: assessSession
      description: Оценка преподавателя хранится рядом с оценкой ИИ и становится итоговой.
      parameters:
        - {$ref: '#/components/parameters/SessionId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TeacherAssessment'}
      responses:
        '200':
          description: Итоговая оценка
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Assessment'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /teacher/materials:
    get:
      tags: [Teacher]
      operationId: listMaterials
      responses:
        '200':
          description: Свои материалы
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Material'}
    post:
      tags: [Teacher]
      operationId: uploadMaterial
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, title]
              properties:
                file: {type: string, format: binary}
                title: {type: string, minLength: 1, maxLength: 200}
                groupIds:
                  type: array
                  items: {type: string, format: uuid}
      responses:
        '201':
          description: Материал загружен
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Material'}
  /teacher/materials/{id}:
    delete:
      tags: [Teacher]
      operationId: deleteMaterial
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '204': {description: Удалено}
  # ------------------------------------------------------------------ admin
  /admin/users:
    get:
      tags: [Admin]
      operationId: listUsers
      parameters:
        - {in: query, name: role, schema: {$ref: '#/components/schemas/Role'}}
        - {in: query, name: active, schema: {type: boolean}}
      responses:
        '200':
          description: Пользователи
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/UserAdminView'}
    post:
      tags: [Admin]
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserCreate'}
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserAdminView'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /admin/users/{id}:
    put:
      tags: [Admin]
      operationId: updateUser
      parameters:
        - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserUpdate'}
      responses:
        '200':
          description: Обновлён
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserAdminView'}
  /admin/users/{id}/block:
    post:
      tags: [Admin]
      operationId: blockUser
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: Заблокирован, результаты сохранены
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserAdminView'}
  /admin/users/{id}/unblock:
    post:
      tags: [Admin]
      operationId: unblockUser
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: Разблокирован
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserAdminView'}
  /admin/users/{id}/reset-password:
    post:
      tags: [Admin]
      operationId: resetPassword
      parameters:
        - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordReset'}
      responses:
        '204': {description: Пароль сброшен}
  /admin/groups:
    get:
      tags: [Admin]
      operationId: listGroups
      responses:
        '200':
          description: Все группы
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Group'}
    post:
      tags: [Admin]
      operationId: createGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GroupUpsert'}
      responses:
        '201':
          description: Создана
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Group'}
  /admin/groups/{id}:
    put:
      tags: [Admin]
      operationId: updateGroup
      parameters:
        - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GroupUpsert'}
      responses:
        '200':
          description: Обновлена
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Group'}
  /admin/settings:
    get:
      tags: [Admin]
      operationId: getSettings
      responses:
        '200':
          description: Настройки
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Settings'}
    put:
      tags: [Admin]
      operationId: updateSettings
      description: Частичное обновление. audit.retention_days не может быть меньше 180.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Settings'}
      responses:
        '200':
          description: Настройки после изменения
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Settings'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  /admin/audit:
    get:
      tags: [Admin]
      operationId: queryAudit
      parameters:
        - {in: query, name: actorId, schema: {type: string, format: uuid}}
        - {in: query, name: role, schema: {$ref: '#/components/schemas/Role'}}
        - {in: query, name: action, schema: {type: string}}
        - {in: query, name: from, schema: {type: string, format: date-time}}
        - {in: query, name: to, schema: {type: string, format: date-time}}
        - {in: query, name: cursor, schema: {type: string}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 500, default: 50}}
      responses:
        '200':
          description: Страница журнала аудита (от новых к старым)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditPage'}
  /admin/system/health:
    get:
      tags: [Admin]
      operationId: systemHealth
      responses:
        '200':
          description: Состояние сервисов
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SystemHealth'}
  /admin/system/log:
    get:
      tags: [Admin]
      operationId: systemLog
      parameters:
        - {in: query, name: lines, schema: {type: integer, minimum: 1, maximum: 2000, default: 200}}
      responses:
        '200':
          description: Хвост файла логов
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LogTail'}
  /admin/backups:
    get:
      tags: [Admin]
      operationId: listBackups
      responses:
        '200':
          description: Резервные копии
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/BackupInfo'}
    post:
      tags: [Admin]
      operationId: createBackup
      responses:
        '201':
          description: Копия создана
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackupInfo'}
  /admin/backups/{fileName}/restore:
    post:
      tags: [Admin]
      operationId: restoreBackup
      description: Необратимо заменяет базу содержимым копии. Требует confirm=RESTORE.
      parameters:
        - {in: path, name: fileName, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RestoreRequest'}
      responses:
        '204': {description: Восстановлено}
        '422': {$ref: '#/components/responses/ErrorResponse'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    contractVersion:
      type: apiKey
      in: header
      name: X-Contract-Version
      description: Версия контракта клиента. Для текущего API укажите 0.3.
  parameters:
    SessionId:
      in: path
      name: sessionId
      required: true
      schema: {type: string, format: uuid}
    CardId:
      in: path
      name: cardId
      required: true
      schema: {type: string, format: uuid}
    CallId:
      in: path
      name: callId
      required: true
      schema: {type: string, format: uuid}
    DraftId:
      in: path
      name: draftId
      required: true
      schema: {type: string, format: uuid}
    Id:
      in: path
      name: id
      required: true
      schema: {type: string, format: uuid}
    StringId:
      in: path
      name: id
      required: true
      schema: {type: string}
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: {type: string, format: uuid}
  responses:
    ErrorResponse:
      description: Ошибка
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  schemas:
    # ---------------------------------------------------------------- common enums
    Role:
      type: string
      enum: [ADMIN, TEACHER, TRAINEE]
    LessonKind:
      type: string
      description: Тренировка — подсказки по ходу; проверка — результат сразу; зачёт — после публикации
      enum: [TRAINING, CHECK, EXAM]
    LessonMode:
      type: string
      enum: [CARD_FILL, CARD_ACTIONS]
    LessonState:
      type: string
      enum: [DRAFT, ACTIVE, COMPLETED]
    CardSource:
      type: string
      enum: [GENERATED, TRAINEE_MADE, MIXED]
    ScenarioSource:
      type: string
      enum: [TICKET, GENERATED, TRAINEE_MADE]
    SessionState:
      type: string
      enum: [PENDING, ACTIVE, COMPLETED]
    CardStatus:
      type: string
      enum: [RECEIVED, RECEIVED_BY_SERVICE, ACCEPTED, NOT_ACCEPTED, RESPONSE_STARTED, ARRIVED, WORK_IN_PROGRESS, WORK_REFUSED, COMPLETED]
    CardAction:
      type: string
      enum: [ACCEPT, DECLINE, START_RESPONSE, ARRIVE, START_WORK, REFUSE_WORK, COMPLETE]
    # ---------------------------------------------------------------- auth / users
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {type: string, minLength: 1, maxLength: 100}
        password: {type: string, minLength: 1, maxLength: 200}
    AuthResponse:
      type: object
      additionalProperties: false
      required: [accessToken, expiresAt, user]
      properties:
        accessToken: {type: string}
        expiresAt: {type: string, format: date-time}
        user: {$ref: '#/components/schemas/User'}
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [current, next]
      properties:
        current: {type: string}
        next: {type: string, minLength: 4, maxLength: 200}
    WsTicket:
      type: object
      additionalProperties: false
      required: [ticket, expiresAt]
      properties:
        ticket: {type: string}
        expiresAt: {type: string, format: date-time}
    User:
      type: object
      additionalProperties: false
      required: [id, displayName, role, login, workstationNumber, groupId]
      properties:
        id: {type: string, format: uuid}
        displayName: {type: string}
        role: {$ref: '#/components/schemas/Role'}
        login: {type: string}
        workstationNumber: {type: [string, 'null'], description: "Номер АРМ обучающегося из учётной записи"}
        groupId: {type: [string, 'null'], format: uuid}
    Workstation:
      type: object
      additionalProperties: false
      required: [id, number, label]
      properties:
        id: {type: string, format: uuid}
        number: {type: string}
        label: {type: string}
    TraineeContext:
      type: object
      additionalProperties: false
      required: [user, workstation, serverTime, activeSession]
      properties:
        user: {$ref: '#/components/schemas/User'}
        workstation: {$ref: '#/components/schemas/Workstation'}
        serverTime: {type: string, format: date-time}
        activeSession:
          anyOf:
            - {$ref: '#/components/schemas/TrainingSession'}
            - {type: 'null'}
    # ---------------------------------------------------------------- sessions
    TrainingSession:
      type: object
      additionalProperties: false
      required: [id, mode, state, title, difficulty, referenceVersion, serverTime, startedAt, completedAt, cardIds, draftIds, lessonId, lessonKind, pendingScenarios]
      properties:
        id: {type: string, format: uuid}
        mode: {$ref: '#/components/schemas/LessonMode'}
        state: {$ref: '#/components/schemas/SessionState'}
        title: {type: string, minLength: 1, maxLength: 200}
        difficulty: {type: integer, minimum: 1, maximum: 10}
        referenceVersion: {type: string}
        serverTime: {type: string, format: date-time}
        startedAt: {type: [string, 'null'], format: date-time}
        completedAt: {type: [string, 'null'], format: date-time}
        cardIds:
          type: array
          items: {type: string, format: uuid}
        draftIds:
          type: array
          items: {type: string, format: uuid}
        lessonId: {type: string, format: uuid}
        lessonKind: {$ref: '#/components/schemas/LessonKind'}
        pendingScenarios: {type: integer, minimum: 0, description: "Сколько вводных ещё в очереди"}
    SessionSummary:
      type: object
      additionalProperties: false
      required: [id, lessonId, lessonTitle, lessonKind, mode, state, startedAt, completedAt]
      properties:
        id: {type: string, format: uuid}
        lessonId: {type: string, format: uuid}
        lessonTitle: {type: string}
        lessonKind: {anyOf: [{$ref: '#/components/schemas/LessonKind'}, {type: 'null'}]}
        mode: {anyOf: [{$ref: '#/components/schemas/LessonMode'}, {type: 'null'}]}
        state: {$ref: '#/components/schemas/SessionState'}
        startedAt: {type: [string, 'null'], format: date-time}
        completedAt: {type: [string, 'null'], format: date-time}
    SubmitResponse:
      type: object
      additionalProperties: false
      required: [assessmentId, state]
      properties:
        assessmentId: {type: string, format: uuid}
        state: {type: string, enum: [CALCULATING, COMPLETED]}
    EventPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/RealtimeEvent'}
    Hint:
      type: object
      additionalProperties: false
      required: [field, message]
      description: Подсказка в режиме тренировки
      properties:
        field: {type: string}
        message: {type: string}
    # ---------------------------------------------------------------- cards
    CardPage:
      type: object
      additionalProperties: false
      required: [serverTime, items, nextCursor]
      properties:
        serverTime: {type: string, format: date-time}
        items:
          type: array
          items: {$ref: '#/components/schemas/CardListItem'}
        nextCursor: {type: [string, 'null']}
    CardListItem:
      type: object
      additionalProperties: false
      required: [id, number, receivedAt, incidentTypeLabel, addressLabel, description, senderLabel, status, allowedActions, sla]
      properties:
        id: {type: string, format: uuid}
        number: {type: string}
        receivedAt: {type: string, format: date-time}
        incidentTypeLabel: {type: string}
        addressLabel: {type: string}
        description: {type: string}
        senderLabel: {type: string}
        status: {$ref: '#/components/schemas/CardStatus'}
        allowedActions:
          type: array
          items: {$ref: '#/components/schemas/CardAction'}
        sla: {$ref: '#/components/schemas/CardSla'}
    IncidentCard:
      type: object
      additionalProperties: false
      required: [id, sessionId, number, receivedAt, source, senderLabel, status, allowedActions, sla, caller, address, description, incidentType, features, assignedServices, scenarioRequirements, callTargets, timeline, outboundCalls, hints, ownServiceCode, opening, serviceProgress]
      properties:
        id: {type: string, format: uuid}
        sessionId: {type: string, format: uuid}
        number: {type: string}
        receivedAt: {type: string, format: date-time}
        source: {type: string}
        senderLabel: {type: string}
        status: {$ref: '#/components/schemas/CardStatus'}
        allowedActions:
          type: array
          items: {$ref: '#/components/schemas/CardAction'}
        sla: {$ref: '#/components/schemas/CardSla'}
        caller: {$ref: '#/components/schemas/Caller'}
        address: {$ref: '#/components/schemas/IncidentAddress'}
        description: {type: string, maxLength: 10000}
        incidentType: {$ref: '#/components/schemas/DictionaryItem'}
        features:
          type: array
          items: {type: string}
        assignedServices:
          type: array
          description: Все оповещённые по ЕКП службы — плитки панели; редактируется только своя
          items: {$ref: '#/components/schemas/DictionaryItem'}
        scenarioRequirements: {$ref: '#/components/schemas/ScenarioRequirements'}
        callTargets:
          type: array
          items: {$ref: '#/components/schemas/CallTarget'}
        timeline:
          type: array
          items: {$ref: '#/components/schemas/CardTimelineEntry'}
        outboundCalls:
          type: array
          items: {$ref: '#/components/schemas/OutboundCall'}
        hints:
          type: array
          items: {$ref: '#/components/schemas/Hint'}
        ownServiceCode: {type: string, description: "Код службы обучающегося (плитка, которую он ведёт)"}
        opening: {$ref: '#/components/schemas/CardOpening'}
        serviceProgress:
          type: array
          description: Независимые состояния всех назначенных служб; сторонние службы меняются автоматически и параллельно.
          items: {$ref: '#/components/schemas/ServiceProgress'}
    CardOpening:
      type: object
      additionalProperties: false
      required: [startedAt, readyAt, openedAt, remainingMs]
      properties:
        startedAt: {type: [string, 'null'], format: date-time}
        readyAt: {type: [string, 'null'], format: date-time}
        openedAt: {type: [string, 'null'], format: date-time}
        remainingMs: {type: integer, format: int64, minimum: 0}
    ServiceProgress:
      type: object
      additionalProperties: false
      required: [service, status, statusChangedAt, openedAt, acceptedAt, responseStartedAt, arrivedAt, workStartedAt, completedAt, simulated]
      properties:
        service: {$ref: '#/components/schemas/DictionaryItem'}
        status: {$ref: '#/components/schemas/CardStatus'}
        statusChangedAt: {type: string, format: date-time}
        openedAt: {type: [string, 'null'], format: date-time}
        acceptedAt: {type: [string, 'null'], format: date-time}
        responseStartedAt: {type: [string, 'null'], format: date-time}
        arrivedAt: {type: [string, 'null'], format: date-time}
        workStartedAt: {type: [string, 'null'], format: date-time}
        completedAt: {type: [string, 'null'], format: date-time}
        simulated: {type: boolean, description: true для автоматически управляемой сторонней службы}
    CardSla:
      type: object
      additionalProperties: false
      required: [acceptanceDeadlineAt, processingDeadlineAt, acceptanceOverdue, processingOverdue]
      properties:
        acceptanceDeadlineAt: {type: string, format: date-time}
        processingDeadlineAt: {type: [string, 'null'], format: date-time}
        acceptanceOverdue: {type: boolean}
        processingOverdue: {type: boolean}
    AcceptanceCommand:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: {type: string, enum: [ACCEPT, DECLINE]}
        reasonCode: {type: [string, 'null']}
        comment: {type: [string, 'null'], maxLength: 2000}
        clientOccurredAt: {type: [string, 'null'], format: date-time}
    ReactionCommand:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: {type: string, enum: [START_RESPONSE, ARRIVE, START_WORK, REFUSE_WORK, COMPLETE]}
        reasonCode: {type: [string, 'null']}
        comment: {type: [string, 'null'], maxLength: 2000}
        clientOccurredAt: {type: [string, 'null'], format: date-time}
    StartCallRequest:
      type: object
      additionalProperties: false
      required: [shortNumber]
      properties:
        shortNumber: {type: string, pattern: '^[0-9]{3,4}$'}
    Caller:
      type: object
      additionalProperties: false
      required: [fullName, phone, relation]
      properties:
        fullName: {type: [string, 'null'], maxLength: 300}
        phone: {type: [string, 'null'], maxLength: 50}
        relation: {type: [string, 'null'], maxLength: 200}
    IncidentAddress:
      type: object
      additionalProperties: false
      required: [raw, region, district, street, house, landmark, latitude, longitude]
      properties:
        raw: {type: string, maxLength: 2000}
        region: {type: [string, 'null']}
        district: {type: [string, 'null']}
        street: {type: [string, 'null']}
        house: {type: [string, 'null']}
        landmark: {type: [string, 'null']}
        latitude: {type: [number, 'null'], minimum: -90, maximum: 90}
        longitude: {type: [number, 'null'], minimum: -180, maximum: 180}
    ScenarioRequirements:
      type: object
      additionalProperties: false
      required: [outboundCallRequired, requiredTargetIds, commentRequiredOnCompletion]
      properties:
        outboundCallRequired: {type: boolean}
        requiredTargetIds:
          type: array
          uniqueItems: true
          items: {type: string}
        commentRequiredOnCompletion: {type: boolean}
    CallTarget:
      type: object
      additionalProperties: false
      required: [id, shortNumber, displayName, organization, voice]
      properties:
        id: {type: string}
        shortNumber: {type: string, pattern: '^[0-9]{3,4}$'}
        displayName: {type: string}
        organization: {type: string}
        voice: {type: string, enum: [MALE, FEMALE]}
    CardTimelineEntry:
      type: object
      additionalProperties: false
      required: [id, action, resultingStatus, reasonCode, comment, occurredAt, actorLabel, actorRole]
      properties:
        id: {type: string, format: uuid}
        action:
          type: string
          enum: [DELIVERED, RECEIVE, ACCEPT, DECLINE, START_RESPONSE, ARRIVE, START_WORK, REFUSE_WORK, COMPLETE]
        resultingStatus: {$ref: '#/components/schemas/CardStatus'}
        reasonCode: {type: [string, 'null']}
        comment: {type: [string, 'null']}
        occurredAt: {type: string, format: date-time}
        actorLabel: {type: string}
        actorRole: {type: string, enum: [SYSTEM, TRAINEE, TEACHER], description: "Действия преподавателя («делай, как я») не попадают в оценку"}
    OutboundCall:
      type: object
      additionalProperties: false
      required: [id, cardId, target, state, startedAt, connectedAt, endedAt, media]
      properties:
        id: {type: string, format: uuid}
        cardId: {type: string, format: uuid}
        target: {$ref: '#/components/schemas/CallTarget'}
        state:
          type: string
          enum: [DIALING, RINGING, CONNECTED, ACKNOWLEDGED, ENDED, NO_ANSWER, FAILED, CANCELLED]
        startedAt: {type: string, format: date-time}
        connectedAt: {type: [string, 'null'], format: date-time}
        endedAt: {type: [string, 'null'], format: date-time}
        media: {$ref: '#/components/schemas/CallMedia'}
    CallMedia:
      type: object
      additionalProperties: false
      required: [ringbackUrl, answerUrl, acknowledgementUrl, expiresAt]
      properties:
        ringbackUrl: {type: [string, 'null'], format: uri}
        answerUrl: {type: [string, 'null'], format: uri}
        acknowledgementUrl: {type: [string, 'null'], format: uri}
        expiresAt: {type: [string, 'null'], format: date-time}
    DictionaryItem:
      type: object
      additionalProperties: false
      required: [id, code, label]
      properties:
        id: {type: string}
        code: {type: string}
        label: {type: string}
    ReferenceBundle:
      type: object
      additionalProperties: false
      required: [referenceVersion, checksum, services, reactionReasons]
      properties:
        referenceVersion: {type: string}
        checksum: {type: string}
        services:
          type: array
          items: {$ref: '#/components/schemas/DictionaryItem'}
        reactionReasons:
          type: array
          items: {$ref: '#/components/schemas/DictionaryItem'}
    IncidentTypeItem:
      type: object
      additionalProperties: false
      required: [id, label, category, frequent, significant]
      properties:
        id: {type: string}
        label: {type: string}
        category: {type: string}
        frequent: {type: boolean, description: "Плашка «часто используемые»"}
        significant: {type: boolean, description: "Плашка «значимые типы»"}
    SurveyCard:
      type: object
      additionalProperties: false
      required: [id, incidentTypeId, questions]
      properties:
        id: {type: string}
        incidentTypeId: {type: string}
        questions:
          type: array
          items: {$ref: '#/components/schemas/SurveyQuestion'}
    SurveyQuestion:
      type: object
      additionalProperties: false
      required: [id, text, kind, options]
      properties:
        id: {type: string}
        text: {type: string}
        kind: {type: string, enum: [CHOICE, TEXT]}
        options:
          type: array
          items: {$ref: '#/components/schemas/DictionaryItem'}
    # ---------------------------------------------------------------- scenarios / drafts
    FormalAddress:
      type: object
      additionalProperties: false
      description: Формализованный адрес по составу полей карточки оператора 112
      properties:
        country: {type: [string, 'null']}
        region: {type: [string, 'null']}
        locality: {type: [string, 'null']}
        object: {type: [string, 'null']}
        okrug: {type: [string, 'null']}
        district: {type: [string, 'null']}
        street: {type: [string, 'null']}
        house: {type: [string, 'null']}
        building: {type: [string, 'null']}
        structure: {type: [string, 'null']}
        apartment: {type: [string, 'null']}
        entrance: {type: [string, 'null']}
        floor: {type: [string, 'null']}
        code: {type: [string, 'null']}
        descriptive: {type: [string, 'null'], description: "Описательный адрес — ориентир заявителя"}
    ScenarioCaller:
      type: object
      additionalProperties: false
      properties:
        fullName: {type: [string, 'null']}
